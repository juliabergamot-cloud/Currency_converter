<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background: transparent;
  }

  body {
    font-family: Georgia, "Times New Roman", serif;
    color: #37352f;
  }

  .exchange-card {
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
    padding: 10px 12px 8px;
    background: transparent;
  }

  .exchange-title {
    margin: 0;
    text-align: center;
    color: #860038;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 29px;
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: -0.4px;
  }

  .title-line {
    width: 48px;
    height: 1px;
    margin: 13px auto 28px;
    background: rgba(134, 0, 56, 0.42);
  }

  .field {
    margin-bottom: 18px;
  }

  .field-label {
    display: block;
    margin: 0 0 8px 3px;
    font-size: 17px;
    line-height: 1.15;
    font-weight: 600;
    color: #37352f;
  }

  .control {
    display: block;
    width: 100%;
    height: 52px;
    margin: 0;
    padding: 0 16px;
    border: 1px solid rgba(55, 53, 47, 0.40);
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.22);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 52px;
    font-weight: 400;
    color: #37352f;
    outline: none;
    font-variant-numeric: lining-nums tabular-nums;
    font-feature-settings: "lnum" 1, "tnum" 1;
  }

  input.control {
    appearance: textfield;
    -moz-appearance: textfield;
    padding-top: 0;
    padding-bottom: 0;
  }

  input.control::-webkit-outer-spin-button,
  input.control::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  select.control {
    cursor: pointer;
    line-height: normal;
    padding-top: 0;
    padding-bottom: 0;
  }

  .control:focus {
    border-color: #860038;
  }

  .result {
    margin-top: 26px;
    text-align: center;
  }

  .rate {
    margin: 0;
    color: #860038;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 43px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.8px;
    font-variant-numeric: lining-nums tabular-nums;
    font-feature-settings:
      "lnum" 1,
      "tnum" 1,
      "kern" 1;
    white-space: nowrap;
  }

  .rate-date {
    margin-top: 8px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;
    line-height: 1.25;
    font-weight: 400;
    color: #37352f;
  }

  .status {
    min-height: 14px;
    margin-top: 5px;
    text-align: center;
    font-size: 11px;
    line-height: 1.2;
    color: rgba(55, 53, 47, 0.55);
  }

  @media (max-width: 400px) {
    .exchange-card {
      padding-left: 10px;
      padding-right: 10px;
    }

    .exchange-title {
      font-size: 27px;
    }

    .rate {
      font-size: 40px;
    }
  }
</style>
</head>

<body>

<div class="exchange-card">

  <h1 class="exchange-title">Exchange Rate</h1>

  <div class="title-line"></div>

  <div class="field">
    <label class="field-label" for="amount">
      Amount:
    </label>

    <input
      class="control"
      id="amount"
      type="number"
      inputmode="decimal"
      value="1"
      min="0"
      step="any"
    >
  </div>

  <div class="field">
    <label class="field-label" for="fromCurrency">
      From
    </label>

    <select
      class="control"
      id="fromCurrency"
    ></select>
  </div>

  <div class="field">
    <label class="field-label" for="toCurrency">
      To
    </label>

    <select
      class="control"
      id="toCurrency"
    ></select>
  </div>

  <div class="result">

    <div
      class="rate"
      id="rate"
    >
      —
    </div>

    <div
      class="rate-date"
      id="rateDate"
    >
      Loading rate…
    </div>

    <div
      class="status"
      id="status"
    ></div>

  </div>

</div>

<script>

const currencyNames = {
  USD: "US Dollar",
  RUB: "Russian Ruble",
  EUR: "Euro",
  GBP: "British Pound",
  CAD: "Canadian Dollar",
  AUD: "Australian Dollar",
  CHF: "Swiss Franc",
  CNY: "Chinese Yuan",
  JPY: "Japanese Yen",
  GEL: "Georgian Lari",
  TRY: "Turkish Lira",
  AED: "UAE Dirham",
  PLN: "Polish Zloty",
  CZK: "Czech Koruna",
  SEK: "Swedish Krona",
  NOK: "Norwegian Krone",
  DKK: "Danish Krone",
  INR: "Indian Rupee",
  KZT: "Kazakhstani Tenge",
  AMD: "Armenian Dram",
  AZN: "Azerbaijani Manat",
  ILS: "Israeli Shekel",
  UAH: "Ukrainian Hryvnia"
};

const amountInput = document.getElementById("amount");
const fromSelect = document.getElementById("fromCurrency");
const toSelect = document.getElementById("toCurrency");

const rateElement = document.getElementById("rate");
const dateElement = document.getElementById("rateDate");
const statusElement = document.getElementById("status");

let exchangeData = null;


/* ---------- CURRENCY SELECTS ---------- */

function createCurrencyOptions(codes) {

  const sortedCodes = [...codes].sort((a, b) => {

    if (a === "USD") return -1;
    if (b === "USD") return 1;

    if (a === "RUB") return -1;
    if (b === "RUB") return 1;

    return a.localeCompare(b);

  });

  fromSelect.innerHTML = "";
  toSelect.innerHTML = "";

  sortedCodes.forEach(code => {

    const name = currencyNames[code] || code;
    const label = `${name} (${code})`;

    const fromOption = document.createElement("option");
    fromOption.value = code;
    fromOption.textContent = label;

    const toOption = document.createElement("option");
    toOption.value = code;
    toOption.textContent = label;

    fromSelect.appendChild(fromOption);
    toSelect.appendChild(toOption);

  });

  fromSelect.value = "USD";
  toSelect.value = "RUB";

}


/* ---------- NUMBER FORMAT ---------- */

function formatNumber(value) {

  if (!Number.isFinite(value)) {
    return "—";
  }

  return new Intl.NumberFormat(
    "en-US",
    {
      minimumFractionDigits: 0,
      maximumFractionDigits: 4,
      useGrouping: false
    }
  ).format(value);

}


/* ---------- CONVERSION ---------- */

function updateConversion() {

  if (!exchangeData) return;

  const amount = parseFloat(amountInput.value);

  const from = fromSelect.value;
  const to = toSelect.value;

  if (!Number.isFinite(amount)) {
    rateElement.textContent = "—";
    return;
  }

  const fromRate = exchangeData.rates[from];
  const toRate = exchangeData.rates[to];

  if (!fromRate || !toRate) {

    rateElement.textContent = "—";
    statusElement.textContent = "Rate unavailable";

    return;
  }

  const converted =
    amount * (toRate / fromRate);

  rateElement.textContent =
    formatNumber(converted);

  statusElement.textContent = "";

}


/* ---------- LOAD RATES ---------- */

async function loadRates() {

  try {

    statusElement.textContent =
      "Updating…";

    const response = await fetch(
      "https://open.er-api.com/v6/latest/USD"
    );

    if (!response.ok) {
      throw new Error("Unable to load rates");
    }

    const data = await response.json();

    if (
      !data ||
      !data.rates ||
      data.result === "error"
    ) {
      throw new Error("Invalid exchange-rate data");
    }

    exchangeData = data;

    createCurrencyOptions(
      Object.keys(data.rates)
    );

    const date = new Date();

    const formattedDate =
      date.toLocaleDateString(
        "en-GB",
        {
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );

    dateElement.textContent =
      `Rates ${formattedDate}`;

    updateConversion();

  }

  catch (error) {

    console.error(error);

    rateElement.textContent = "—";

    dateElement.textContent =
      "Exchange rate unavailable";

    statusElement.textContent =
      "Please try again later";

  }

}


/* ---------- EVENTS ---------- */

amountInput.addEventListener(
  "input",
  updateConversion
);

fromSelect.addEventListener(
  "change",
  updateConversion
);

toSelect.addEventListener(
  "change",
  updateConversion
);


/* ---------- START ---------- */

loadRates();

</script>

</body>
</html>
